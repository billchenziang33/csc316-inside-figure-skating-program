<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light">
	<title>Beijing 2022 · 3D movement reference playback</title>
	<style>
		:root{font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f2b29;background:#f2f1ec;color-scheme:light}
		*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
		body{display:flex;flex-direction:column;min-height:0;background:#f2f1ec}
		body.css-fullscreen{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:9999}
		.player-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem 1.1rem;background:#fffefa;color:#1f2b29;border-bottom:1px solid #dfe2dc;flex:none}
		.player-head>div{display:flex;align-items:center;gap:1rem;min-width:0}.player-head strong{font:600 1.22rem/1.2 Georgia,serif;letter-spacing:-.02em}.badge{font:600 .74rem/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:#6c6658;border:1px solid #d9d2c4;border-radius:999px;padding:.4rem .7rem;white-space:nowrap}
		.stage-shell{position:relative;flex:1;min-height:120px;overflow:hidden;background:#dce8e8}
		#blender-stage{display:block;width:100%;height:100%;background:#dce8e8;touch-action:none;cursor:grab}#blender-stage.is-dragging{cursor:grabbing}#blender-stage.is-panning{cursor:move}
		.flight-island[hidden],.flight-panel[hidden]{display:none}.flight-island{position:absolute;z-index:4;top:.9rem;right:.9rem;width:min(360px,calc(100% - 1.8rem));color:#1f2b29}
		.flight-island-toggle{display:grid;width:100%;grid-template-columns:12px minmax(0,1fr) auto 12px;align-items:center;gap:.65rem;min-height:62px;padding:.55rem .9rem;border:1px solid rgba(207,213,206,.95);border-radius:999px;background:rgba(255,254,250,.93);box-shadow:0 10px 28px rgba(29,48,52,.18);backdrop-filter:blur(16px);text-align:left;transition:border-radius .18s ease,background .18s ease,box-shadow .18s ease}
		.flight-island-toggle:hover{background:rgba(255,254,250,.98)}.flight-island.is-open .flight-island-toggle{border-radius:18px 18px 12px 12px;box-shadow:0 4px 14px rgba(29,48,52,.12)}
		.flight-indicator{width:9px;height:9px;border-radius:50%;background:#397a74;box-shadow:0 0 0 4px rgba(57,122,116,.13)}.flight-summary{display:grid;min-width:0;gap:.08rem}.flight-summary small,.flight-panel-kicker{color:#64716c;font:600 .68rem/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.07em;text-transform:uppercase}.flight-summary strong{overflow:hidden;font-size:.95rem;text-overflow:ellipsis;white-space:nowrap}.flight-height{font-size:.98rem;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}.flight-chevron{width:8px;height:8px;border-right:1.5px solid #64716c;border-bottom:1.5px solid #64716c;transform:rotate(45deg) translateY(-2px);transition:transform .18s ease}.flight-island.is-open .flight-chevron{transform:rotate(225deg) translate(-1px,-1px)}
		.flight-panel{position:absolute;top:calc(100% + .45rem);right:0;width:100%;padding:1rem;border:1px solid rgba(207,213,206,.96);border-radius:18px;background:rgba(255,254,250,.95);box-shadow:0 16px 40px rgba(29,48,52,.22);backdrop-filter:blur(18px);transform:translateY(-5px) scale(.985);transform-origin:top right;opacity:0;transition:transform .18s cubic-bezier(.2,.75,.25,1),opacity .15s ease}
		.flight-panel.is-visible{transform:translateY(0) scale(1);opacity:1}.flight-panel-heading{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.85rem}.flight-panel-heading>div{display:grid;gap:.2rem}.flight-panel-heading strong{font:600 1rem/1.2 Georgia,serif}.flight-panel-close{width:44px;min-height:44px;padding:0;border-radius:50%;font-size:1.2rem;line-height:1}
		.flight-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}.flight-details div{min-width:0;padding:.65rem .7rem;border:1px solid #e0e4dd;border-radius:11px;background:rgba(242,241,236,.76)}.flight-details b{display:block;margin-bottom:.18rem;color:#64716c;font:500 .7rem/1.3 ui-monospace,SFMono-Regular,Consolas,monospace}.flight-details strong{font-size:.98rem;font-variant-numeric:tabular-nums}.flight-reference{margin:.75rem 0 0;color:#64716c;font-size:.72rem;line-height:1.35}
		.stage-message{align-self:center;margin:.12rem 0;padding:0 .5rem;color:#64716c;font:500 .8rem/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.03em}
		.camera-picks{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0;padding:.45rem .8rem .3rem;background:#f2f1ec}
		.camera-label{margin-right:.65rem;color:#78837d;font:600 .75rem/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase}
		.camera-explain{margin-left:.75rem;max-width:280px;color:#596b61;font-size:.86rem;line-height:1.4}
		button,select{min-height:46px;font:500 .98rem/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;color:#29352f;background:#fffefa;border:1px solid #cfd5ce;border-radius:5px;padding:.6rem .95rem;cursor:pointer}
		button:hover,select:hover{background:#eaf0eb}button[aria-pressed=true]{border-color:#397a74;background:#eaf0eb;color:#255e54;box-shadow:inset 0 -2px #397a74}
		button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #d7aa7c;outline-offset:2px}
		button:disabled,input:disabled{opacity:.55;cursor:wait}
		.controls{display:grid;grid-template-columns:auto auto minmax(80px,1fr) minmax(110px,auto) auto auto;align-items:center;gap:.5rem;padding:.45rem 1rem .65rem;background:#f2f1ec}
		input[type=range]{width:100%;min-width:0;accent-color:#397a74}label{font:600 .75rem/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:#64716c;text-transform:uppercase;letter-spacing:.08em}.counter{font:500 .82rem/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;text-align:right;white-space:nowrap;color:#45534b;font-variant-numeric:tabular-nums}
		.note{flex:none;margin:0;padding:.15rem 1rem .45rem;color:#64716c;background:#f2f1ec;font-size:.82rem;line-height:1.4}
		.library-return{display:inline-flex;align-items:center;min-height:48px;padding:.55rem .9rem;border:1px solid #cfd5ce;border-radius:5px;background:#f8f8f3;color:#28665e;font-size:.98rem;font-weight:600;text-decoration:none;white-space:nowrap}.library-return:hover{background:#eaf0eb;border-color:#9eb4a6}
		.source-link{color:#397a74;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}.source-link:hover{color:#255e54}
		.camera-picks button:first-of-type{border-radius:999px 0 0 999px}.camera-picks button:last-of-type{border-radius:0 999px 999px 0;margin-left:-1px}
		.camera-picks button[data-view="bullet"]{margin-left:.45rem;border-radius:999px}
		#blender-play{background:#397a74;color:#fff;border-color:#397a74;font-weight:650;min-width:86px}#blender-play:hover{background:#28635d}
		#blender-fullscreen{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px}#blender-fullscreen:hover{background:#e7e9e1}
		@media(max-width:700px){.player-head{padding:.55rem .7rem}.player-head>div{align-items:flex-start;flex-direction:column;gap:.35rem}.player-head strong{font-size:1.05rem}.badge{font-size:.62rem}.stage-shell{min-height:100px}.flight-island{top:.55rem;right:.55rem;width:min(350px,calc(100% - 1.1rem))}.flight-island-toggle{min-height:56px;padding:.45rem .75rem}.flight-details{gap:.4rem}.flight-details div{padding:.55rem}.flight-panel{padding:.8rem}.controls{grid-template-columns:auto auto 1fr auto;gap:.4rem;padding:.4rem .65rem .55rem}.controls #blender-frame{grid-column:1/-1;grid-row:2}.controls #blender-counter{grid-column:1/-1;text-align:left}.controls .speed-label{grid-column:1;grid-row:3}.controls #blender-speed{grid-column:2;grid-row:3;min-width:0;width:100%}.controls #blender-fullscreen{grid-column:3/5;grid-row:3}.note{padding:.15rem .7rem .4rem;font-size:.68rem}.camera-picks{row-gap:.4rem;padding:.4rem .65rem .25rem}.camera-explain{flex-basis:100%;max-width:none;margin:.1rem 0 0;text-align:center}}
		@media(prefers-reduced-motion:reduce){.flight-island-toggle,.flight-panel,.flight-chevron{transition:none}}
</head>
<body>
	<div class="player-head"><div><a class="library-return" href="./">← 3D library</a><strong>Beijing 2022 · 3D movement reference</strong></div><span class="badge">ILLUSTRATIVE / SIMULATED</span></div>
	<div class="stage-shell" id="stage-shell">
		<canvas id="blender-stage" aria-label="Illustrative figure skating movement on capsule ice"></canvas>
		<section id="flight-hud" class="flight-island" hidden aria-label="Live simulated flight measurements">
			<button type="button" id="flight-toggle" class="flight-island-toggle" aria-expanded="false" aria-controls="flight-panel" aria-label="Open flight details">
				<span class="flight-indicator" aria-hidden="true"></span>
				<span class="flight-summary"><small>Flight · simulated</small><strong id="flight-phase">Approach</strong></span>
				<strong id="flight-height" class="flight-height">—</strong>
				<span class="flight-chevron" aria-hidden="true"></span>
			</button>
			<div id="flight-panel" class="flight-panel" hidden aria-label="Flight measurements">
				<div class="flight-panel-heading"><div><span class="flight-panel-kicker">Trajectory readout</span><strong>Live simulated measurements</strong></div><button type="button" id="flight-close" class="flight-panel-close" aria-label="Close flight details">×</button></div>
				<div class="flight-details">
					<div><b>Current horizontal travel</b><strong id="flight-distance">—</strong></div>
					<div><b>Peak rise</b><strong id="flight-peak">—</strong></div>
					<div><b>Take-off to landing</b><strong id="flight-total">—</strong></div>
				</div>
				<p class="flight-reference">Measurements from the exported Blender trajectory · illustrative / simulated</p>
			</div>
		</section>
	</div>
	<div class="stage-message" id="stage-message" role="status">Loading 3D movement…</div>
	<div class="camera-picks" role="group" aria-label="Camera framing">
		<span class="camera-label" aria-hidden="true">View</span>
		<button type="button" data-view="angled" aria-pressed="true">45° angle</button>
		<button type="button" data-view="auto" aria-pressed="false">Auto fit</button>
		<button type="button" data-view="bullet" aria-pressed="false" title="Pause at the selected moment and orbit around the full-body pose from a lower 35° view">Bullet Time</button>
		<span class="camera-explain">Pause on a frame and orbit around the skater once from a lower 35° view.</span>
	</div>
	<div class="controls"><button id="blender-play" type="button" disabled>Play</button><button id="blender-reset" type="button" disabled>Restart</button><input id="blender-frame" type="range" min="0" max="159" step="1" value="0" aria-label="Animation progress" disabled><span id="blender-counter" class="counter">Frame 1 / 160 · Approach · simulated</span><label class="speed-label" for="blender-speed">Speed</label><select id="blender-speed" aria-label="Playback speed"><option value="0.35">Slow · 0.35×</option><option value="1" selected>Normal · 1×</option></select><button id="blender-fullscreen" type="button" disabled>Fullscreen</button></div>
	<p class="note" id="motion-note"></p>
	<p class="note">Poses, phases and trajectories are illustrative simulations. <a class="source-link" href="./THIRD_PARTY_NOTICES.md" target="_blank" rel="noreferrer">Sources and licenses</a></p>
	<script src="/movement/axel-1a-prototype/vendor/three.umd.js"></script>
	<script src="/movement/axel-1a-prototype/vendor/GLTFLoader.js"></script>
	<script type="module" src="./blender-player.js"></script>
</body>
</html>
