<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>FS-Jump3D · CSC316 动作库</title>
 <style>
  :root{font-family:Arial,"Microsoft YaHei",sans-serif;color:#e8f3f5;background:#102731;color-scheme:dark}
  *{box-sizing:border-box}body{margin:0}header,main{max-width:1440px;margin:auto;padding:20px 24px}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:24px;margin:0 0 8px}
  p{line-height:1.6;margin:8px 0;color:#b8d0d8}a{color:#9ae4df}label{display:flex;flex-direction:column;gap:8px;font-size:13px}
  select{font:inherit;min-height:42px;padding:8px;border:1px solid #5a7b86;border-radius:5px;background:#1e3d49;color:#fff;max-width:100%}
  .selectors{display:grid;grid-template-columns:1fr 2fr 1fr;gap:16px;margin:18px 0}
  iframe{width:100%;height:min(76vh,900px);min-height:620px;border:1px solid #456976;border-radius:6px;background:#18313e}
  .details{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin:12px 0;font-size:13px}
  #status{font-size:13px}.notice{font-size:13px}button{font:inherit;background:#91d7d0;color:#12313b;border:0;border-radius:5px;padding:10px 18px;cursor:pointer}
  @media(max-width:650px){header,main{padding:14px}header{display:block}.selectors{grid-template-columns:1fr}iframe{min-height:850px;height:90vh}h1{font-size:20px}}
 </style>
</head>
<body>
 <header><div><h1>FS-Jump3D 动作库</h1><p>选择采集片段和 Blender 迭代版本，检查同一动作的侧视、正视和冰鞋近景。</p></div><a href="/">返回 CSC316 项目</a></header>
 <main>
  <p id="status" role="status">正在加载动作目录…</p>
  <div class="selectors">
   <label>动作类别<select id="family"><option value="all">全部类别</option></select></label>
   <label>采集片段<select id="record"></select></label>
   <label>迭代版本<select id="round"><option value="r3">r3 · 细节与展示</option><option value="r2">r2 · 连续与接触修正</option><option value="r1">r1 · 初次重定向</option></select></label>
  </div>
  <div class="details"><span id="context"></span><a id="open-player" target="_blank" rel="noopener">单独打开播放器</a><a id="download-model" download>下载当前 GLB</a></div>
  <p class="notice">FS-Jump3D 采集者以 A–D 匿名标识。动作经过模型重定向与模拟修正，阶段标记为估计值。r1、r2 供迭代对照，r3 的检查状态在目录中列出。</p>
  <iframe id="viewer" title="FS-Jump3D Blender 动作播放器" allow="fullscreen"></iframe>
  <p class="notice"><a href="https://github.com/ryota-skating/FS-Jump3D" target="_blank" rel="noopener">FS-Jump3D 来源</a> · 数据与改编动作按 CC BY-NC-SA 4.0 署名。人物、冰鞋与 Three.js 的署名见动作库说明。</p>
 </main>
 <script type="module">
  const response=await fetch('./records-manifest.json');
  if(!response.ok)throw new Error('动作目录读取失败');
  const records=await response.json();
  const family=document.querySelector('#family');
  const recordSelect=document.querySelector('#record');
  const round=document.querySelector('#round');
  const names={Axel:'Axel · 阿克塞尔',Salchow:'Salchow · 萨霍夫',Toeloop:'Toe loop · 后外点冰',Loop:'Loop · 后外结环',Flip:'Flip · 后内点冰',Lutz:'Lutz · 勾手',Comb:'Combination · 连跳'};
  for(const key of Object.keys(names)){const option=new Option(names[key],key);family.add(option);}
  const generated=records.filter(record=>record.rounds.includes('r3'));
  const playable=record=>record.geometry_status==='geometry_pass'&&record.rounds.includes('r3')&&record.available!==false;
  const reviewed=records.filter(playable);
  document.querySelector('#status').textContent=`${records.length} 段源记录 · 已生成 r3 ${generated.length} 段 · 可预览 ${reviewed.length} 段`;
  function load(){
   const record=records.find(item=>item.id===recordSelect.value);
   if(!record)return;
   for(const option of round.options)option.disabled=!record.rounds.includes(option.value);
   if(!record.rounds.includes(round.value))round.value=record.rounds.at(-1);
   const url=new URL('./player.html',location.href);
   url.searchParams.set('id',record.id);url.searchParams.set('round',round.value);
   document.querySelector('#viewer').src=url.href;
   document.querySelector('#open-player').href=url.href;
   document.querySelector('#download-model').href=`./${record.family}/${record.id}/${record.id}-${round.value}-web.glb`;
   document.querySelector('#context').textContent=`${record.id} · ${record.frames} 帧 · ${record.fps} fps · ${record.geometry_status==='geometry_pass'?'几何采样检查通过':'检查进行中'}`;
  }
  function filter(){
   const previous=recordSelect.value;
  const candidates=records.filter(record=>family.value==='all'||record.family===family.value);
   recordSelect.replaceChildren();
   const ready=candidates.filter(playable);
   for(const record of ready)recordSelect.add(new Option(record.id,record.id));
   recordSelect.disabled=!ready.length;
   round.disabled=!ready.length;
   for(const id of ['viewer','open-player','download-model'])document.getElementById(id).hidden=!ready.length;
   if(ready.length){recordSelect.value=ready.some(record=>record.id===previous)?previous:ready[0].id;load();}
   else {
    document.querySelector('#context').textContent=`此类别有 ${candidates.length} 段源记录，暂未开放预览。`;
    document.querySelector('#viewer').removeAttribute('src');
   }
  }
  family.addEventListener('change',filter);recordSelect.addEventListener('change',load);round.addEventListener('change',load);filter();
 </script>
</body>
</html>
